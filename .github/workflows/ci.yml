name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # App unit tests (the 105 v1.4.1 tests). The scripts/*.test.mjs suite
      # reads gitignored .grok template files that are not in this snapshot.
      - name: Test
        run: node --experimental-strip-types --test 'src/lib/**/*.test.ts'

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
