name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TanStack Start requires Node >= 22.12 (Node 20 fails the engine check).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Baked into the static app. Repository secrets only — never commit the values.
      # Empty secrets leave the Command box with a clear "not set up" message.
      - name: Build static web app
        env:
          # Public OAuth client id. The browser token flow does not use a client secret.
          VITE_GOOGLE_CLIENT_ID: "84319457158-nr9sm2i9v3l9plrbabbe2okod8c771be.apps.googleusercontent.com"
          # Calendar hook. Repository secrets only — never commit the values.
          # Empty secrets leave the Command box with a clear "not set up" message.
          VITE_CALENDAR_HOOK_URL: ${{ secrets.VITE_CALENDAR_HOOK_URL }}
          VITE_CALENDAR_HOOK_TOKEN: ${{ secrets.VITE_CALENDAR_HOOK_TOKEN }}
        run: npm run build:spa

      - name: Confirm Google client ID is in the SPA bundle
        run: |
          set -euo pipefail
          id="84319457158-nr9sm2i9v3l9plrbabbe2okod8c771be.apps.googleusercontent.com"
          echo "Searching dist/**/*.js for the public client ID"
          if ! grep -R -l -F --include='*.js' --include='*.mjs' "$id" dist; then
            echo "VITE_GOOGLE_CLIENT_ID was not inlined into the SPA build" >&2
            exit 1
          fi

      - name: Add and sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android-version.mjs

      # Release APKs are signed off GitHub. These steps run only when the
      # optional repository secret is present; otherwise Gradle uses a runner key.
      - name: Detect debug keystore secret
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install debug keystore
        if: steps.keystore.outputs.set == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Checklist-debug.apk

      - name: Confirm debug APK signing certificate
        if: steps.keystore.outputs.set == 'true'
        run: |
          set -euo pipefail
          fp="$(keytool -printcert -jarfile Checklist-debug.apk | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          expected="96e175cdea2ecefd332b8eba4e499ef25821b8f153f33818484889fc0df031cc"
          echo "APK cert SHA-256: ${fp}"
          if [ "${fp}" != "${expected}" ]; then
            echo "Debug APK is not signed with the shared debug certificate" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checklist-debug-apk
          path: Checklist-debug.apk

      # Push to main publishes a new non-prerelease. pull_request and
      # workflow_dispatch build the APK and stop here.
      - name: Compute next patch tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "${latest}" ]; then
            echo "No vMAJOR.MINOR.PATCH tag found to bump" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest} -> ${next}"

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Checklist ${{ steps.version.outputs.tag }}
          body: Debug APK built from ${{ github.sha }}. Download Checklist-debug.apk on your Android phone and allow installing from this source.
          files: Checklist-debug.apk
          draft: false
          prerelease: false
          make_latest: true
